name: Deploy DarkCircle Suite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gate the portal before spending minutes on the sub-app builds
      - name: Verify QRB 3D asset (structure, scale, lights, animation)
        run: node tools/verify_qrb_assets.mjs

      - name: Verify portal sources are pure ASCII (encoding regression guard)
        run: |
          if LC_ALL=C grep -n '[^[:print:][:space:]]' index.html 404.html; then
            echo "non-ASCII bytes found; use HTML entities or JS escapes" >&2
            exit 1
          fi

      - name: Guard - the retired product name must not return
        run: bash tools/check_legacy_name.sh

      - name: Test 404 / subdomain redirect router
        run: node tools/test_404_router.mjs

      - name: Test Circleswap token metadata service
        run: node --test q0/packages/quai-service/test/tokenMetadata.test.ts

      - name: Test Circleswap farm view model
        run: node --test q0/packages/quai-service/test/farmView.test.ts

      - name: Test who may see the Circleswap Deploy tab
        run: node --test q0/apps/stats-app/test/adminAccess.test.ts

      - name: Test the Quainance pair and launchpad aggregate
        run: node --test q0/packages/quai-service/test/quainance.test.ts

      - name: Test LP yield maths (fees and farm rewards)
        run: node --test q0/packages/quai-service/test/yield.test.ts

      - name: Build Q0 / Circleswap
        run: |
          cd q0
          pnpm install --frozen-lockfile
          pnpm --filter quai-service build
          pnpm --filter stats-app build
          cd ..

      - name: Build MultisigOWS / DarkSafe
        run: |
          cd multisigows
          pnpm install --frozen-lockfile
          pnpm --filter @darksafe/core build
          pnpm --filter @darksafe/ui build
          pnpm --filter @darksafe/verify build
          pnpm --filter @darksafe/watcher build
          pnpm --filter @darksafe/web build
          cd ..

      - name: Assemble Unified GitHub Pages Site
        run: bash tools/assemble_site.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
