name: Deploy DarkCircle Suite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Q0 / Circleswap
        run: |
          cd q0
          pnpm install --frozen-lockfile
          pnpm --filter quai-service build
          pnpm --filter stats-app build
          cd ..

      - name: Build MultisigOWS / DarkSafe
        run: |
          cd multisigows
          pnpm install --frozen-lockfile
          pnpm --filter @safebuddy/core build
          pnpm --filter @safebuddy/ui build
          pnpm --filter @safebuddy/verify build
          pnpm --filter @safebuddy/watcher build
          pnpm --filter @safebuddy/web build
          cd ..

      - name: Assemble Unified GitHub Pages Site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp 404.html _site/404.html
          touch _site/.nojekyll

          # 3D Assets (QRB Containment Chamber Scene)
          mkdir -p _site/assets/3d
          cp -r assets/3d/* _site/assets/3d/

          # DarkCircle Tumbler UI
          mkdir -p _site/x402tumbler
          cp -r x402tumbler/ui/* _site/x402tumbler/
          mkdir -p _site/darkcircle
          cp -r x402tumbler/ui/* _site/darkcircle/

          # Q0 / Circleswap Dashboard
          mkdir -p _site/q0
          cp -r q0/apps/stats-app/dist/* _site/q0/
          mkdir -p _site/circleswap
          cp -r q0/apps/stats-app/dist/* _site/circleswap/

          # DarkSafe / SafeBuddy Web Vault
          mkdir -p _site/multisigows
          cp -r multisigows/apps/web/dist/* _site/multisigows/
          mkdir -p _site/darksafe
          cp -r multisigows/apps/web/dist/* _site/darksafe/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
