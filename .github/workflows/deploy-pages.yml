name: Deploy DarkCircle Suite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gate the portal before spending minutes on the sub-app builds
      - name: Verify QRB 3D asset (structure, scale, lights, animation)
        run: node tools/verify_qrb_assets.mjs

      - name: Verify portal sources are pure ASCII (encoding regression guard)
        run: |
          if LC_ALL=C grep -n '[^[:print:][:space:]]' index.html 404.html; then
            echo "non-ASCII bytes found; use HTML entities or JS escapes" >&2
            exit 1
          fi

      - name: Guard - the retired product name must not return
        run: bash tools/check_legacy_name.sh

      - name: Test 404 / subdomain redirect router
        run: node tools/test_404_router.mjs

      - name: Test Circleswap token metadata service
        run: node --test q0/packages/quai-service/test/tokenMetadata.test.ts

      - name: Test Circleswap farm view model
        run: node --test q0/packages/quai-service/test/farmView.test.ts

      - name: Test who may see the Circleswap Deploy tab
        run: node --test q0/apps/stats-app/test/adminAccess.test.ts

      - name: Test the Quainance pair and launchpad aggregate
        run: node --test q0/packages/quai-service/test/quainance.test.ts

      - name: Test LP yield maths (fees and farm rewards)
        run: node --test q0/packages/quai-service/test/yield.test.ts

      # Quainance's launchpad catalog sends no CORS header, so the deployed page reads the snapshot bundled at build time.
      # Refresh it first so it is as fresh as this deploy. Best effort: if Quainance is down the committed snapshot is used.
      - name: Refresh the Quainance launchpad snapshot
        continue-on-error: true
        run: node q0/apps/stats-app/scripts/refresh-quainance-catalog.mjs

      - name: Build Q0 / Circleswap
        run: |
          cd q0
          pnpm install --frozen-lockfile
          pnpm --filter quai-service build
          pnpm --filter stats-app build
          cd ..

      - name: Build MultisigOWS / DarkSafe
        run: |
          cd multisigows
          pnpm install --frozen-lockfile
          pnpm --filter @darksafe/core build
          pnpm --filter @darksafe/ui build
          pnpm --filter @darksafe/verify build
          pnpm --filter @darksafe/watcher build
          pnpm --filter @darksafe/web build
          cd ..

      # The contract suites, the SDK tests (including an end-to-end run against a Hardhat node the test
      # starts itself on 127.0.0.1:18545) and the integrity gate run before the site ships: the integrity
      # gate also checks the production bundle carries no local dev wallet.
      - name: Build, test and gate Dark Questate
        run: |
          cd b6
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm integrity
          cd ..

      # Same gate for the Grand Guild Halls: contract suites, core and web unit tests, and the
      # integrity gate that keeps the local dev wallet out of the production bundle.
      - name: Build, test and gate DarkOrder
        run: |
          cd d0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm integrity
          cd ..

      # The Foundry fuzz and invariant campaigns run against the Hardhat-compiled bytecode.
      - name: Foundry toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: DarkOrder fuzz and invariant campaigns
        working-directory: d0/packages/contracts
        run: forge test

      - name: Dark Questate fuzz and invariant campaigns
        working-directory: b6/packages/contracts
        run: forge test

      # Dark Star Rail lives in its own repository (BOLTEVM/BTAI) and is gitignored here, so the
      # deploy checks it out fresh and static-exports the Next.js frontend rooted at /bai/.
      # NEXT_PUBLIC_* values are compile-time public config, not secrets. The wallet flow needs
      # the BTAI_PRIVY_APP_ID Actions secret (a Privy app id is client-side public); without it
      # the exported page renders the app's explicit "privy app id required" notice instead of
      # looping or crashing. BTAI_API_BASE_URL (an Actions variable) points at the hosted talent
      # API; without it the directory panel reports the API as unavailable.
      - name: Checkout Dark Star Rail (BOLTEVM/BTAI)
        uses: actions/checkout@v4
        with:
          repository: BOLTEVM/BTAI
          path: bai

      - name: Build Dark Star Rail frontend (static export for /bai/)
        working-directory: bai
        env:
          PAGES_BASE_PATH: /bai
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.BTAI_PRIVY_APP_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.BTAI_API_BASE_URL }}
          NEXT_PUBLIC_X402_NETWORK: quai
          NEXT_PUBLIC_TALENT_AGENT_QUAI_ADDRESS: 0x00558035cfFAa4766A7f77cA987650711bDaF7a6
          NEXT_PUBLIC_QUAI_SETTLEMENT_TOKEN: 0x0049F7cbCa3556C2DfaE62Aafa7015F99de1b8f5
          NEXT_PUBLIC_QUAI_ORCHARD_SETTLEMENT_TOKEN: 0x0043a6b95A33A5Ac6ece32A4C172AE83390c2C59
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter frontend build

      - name: Assemble Unified GitHub Pages Site
        run: bash tools/assemble_site.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
