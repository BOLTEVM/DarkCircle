<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting &mdash; DarkCircle Suite</title>
  <script>
    (function () {
      var host = window.location.hostname.toLowerCase();
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // The suite is served either from a domain root or, on GitHub project pages, from
      // /<repo>/. Redirect targets must keep that prefix, or they leave the site.
      var base = '/';
      if (/\.github\.io$/.test(host)) {
        var first = path.split('/')[1];
        // app folders are lowercase; the repo folder ("DarkCircle") is not, so match case-sensitively
        if (first && !/^(q0|circleswap|multisigows|darksafe|x402tumbler|darkcircle|darkquestate|questate|darkorder|guildhalls|bai|darkstarrail|starrail)$/.test(first)) {
          base = '/' + first + '/';
        }
      }

      // Never "redirect" to the URL we are already on. Pages serves this file for EVERY missing
      // path, so when the target app is absent from the deployed bundle an unguarded replace()
      // would reload this page forever (that was the mobile /bai/ loop). Stand down and say so.
      function go(target) {
        if (target !== path + search + hash) {
          window.location.replace(target);
          return;
        }
        document.addEventListener('DOMContentLoaded', function () {
          var note = document.getElementById('note');
          if (note) {
            note.innerHTML = 'This app is not part of the deployed bundle yet &mdash; back to the <a href="' + base + '" style="color:#7dd3fc;">DarkCircle portal</a>.';
          }
        });
      }

      // 1. Subdomain matching
      if (host.startsWith('q0.') || host.startsWith('circleswap.') || host.includes('q0-')) {
        go(base + 'q0/' + search + hash);
        return;
      }
      if (host.startsWith('darksafe.') || host.startsWith('safe.') || host.startsWith('multisig.') || host.includes('darksafe-')) {
        go(base + 'multisigows/' + search + hash);
        return;
      }
      if (host.startsWith('tumbler.') || host.startsWith('privacy.') || host.startsWith('x402.') || host.includes('tumbler-')) {
        go(base + 'x402tumbler/' + search + hash);
        return;
      }
      if (host.startsWith('darkorder.') || host.startsWith('guild.') || host.startsWith('halls.') || host.includes('darkorder-')) {
        go(base + 'darkorder/' + search + hash);
        return;
      }
      if (host.startsWith('questate.') || host.startsWith('darkquestate.') || host.startsWith('realestate.') || host.includes('questate-')) {
        go(base + 'darkquestate/' + search + hash);
        return;
      }
      if (host.startsWith('darkstarrail.') || host.startsWith('starrail.') || host.startsWith('rail.') || host.startsWith('talent.') || host.includes('starrail-')) {
        go(base + 'bai/' + search + hash);
        return;
      }

      // 2. Sub-path fallback: a deep link into an app that has no such file
      var rest = path.slice(base.length - 1);
      if (/^\/(q0|circleswap)(\/|$)/i.test(rest)) {
        go(base + 'q0/' + search + hash);
        return;
      }
      if (/^\/(multisigows|darksafe)(\/|$)/i.test(rest)) {
        go(base + 'multisigows/' + search + hash);
        return;
      }
      if (/^\/(x402tumbler|darkcircle)(\/|$)/i.test(rest)) {
        go(base + 'x402tumbler/' + search + hash);
        return;
      }
      if (/^\/(darkquestate|questate)(\/|$)/i.test(rest)) {
        go(base + 'darkquestate/' + search + hash);
        return;
      }
      if (/^\/(darkorder|guildhalls)(\/|$)/i.test(rest)) {
        go(base + 'darkorder/' + search + hash);
        return;
      }
      if (/^\/(bai|darkstarrail|starrail)(\/|$)/i.test(rest)) {
        go(base + 'bai/' + search + hash);
        return;
      }

      // 3. Default: the portal
      go(base + search + hash);
    })();
  </script>
</head>
<body style="background:#07090e;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <p id="note">Redirecting to DarkCircle Suite...</p>
  <footer style="position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">
    <a href="https://boltevm.com" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">Powered by <img src="Boltfont.png" alt="BOLT" height="18" style="height:18px;width:auto;vertical-align:middle;margin-left:6px;filter:invert(1);opacity:.8;"></a>
  </footer>
</body>
</html>
