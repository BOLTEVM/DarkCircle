name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job starts from read-only; nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Core + web (typecheck, tests, build, pinned bytecode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the tag is a comment only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install (lockfile only, no dependency install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages (compiles contracts first)
        run: pnpm build

      - name: Pinned code hashes match the compiled contracts
        run: pnpm -F @safebuddy/contracts pin:check

      - name: Typecheck
        run: pnpm lint

      - name: Core tests
        run: pnpm -F @safebuddy/core test

      - name: Web tests (incl. security headers, QR round-trip, v2 review flow)
        run: pnpm -F @safebuddy/web test

      - name: Verifier and watcher unit tests
        run: |
          pnpm -F @safebuddy/verify test
          pnpm -F @safebuddy/watcher test

      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

  contracts:
    name: Contracts (tests, coverage, opcode gate, Slither)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile
        run: pnpm -F @safebuddy/contracts compile

      # The integration tests drive core, the verifier CLI and the watcher against the real contracts.
      - name: Build the TypeScript packages the integration tests use
        run: pnpm -F @safebuddy/core -F @safebuddy/verify -F @safebuddy/watcher build

      - name: Tests (v2 unit, stateful fuzz, core/verifier/watcher integration)
        run: pnpm -F @safebuddy/contracts test

      - name: v2 bytecode has no DELEGATECALL/CALLCODE/SELFDESTRUCT and no post-Paris opcodes
        run: pnpm -F @safebuddy/contracts opcode:check

      # foundry.toml sits next to hardhat.config.cjs, so the framework is named explicitly.
      - name: Slither (fail on medium or higher)
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: packages/contracts
          ignore-compile: true
          fail-on: medium
          slither-args: --compile-force-framework hardhat --filter-paths "node_modules|contracts/test|lib/|test/"

      # Last on purpose: solidity-coverage rewrites artifacts/ with instrumented bytecode,
      # which would poison the opcode gate and Slither if they ran afterwards.
      - name: Coverage (v2 vault >= 95% branches, 100% functions)
        run: pnpm -F @safebuddy/contracts coverage:check

  foundry:
    name: Contracts (Foundry fuzz + invariants, TS differential, lint, gas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The Foundry suites deploy the Hardhat-compiled bytecode (the bytecode that is pinned
      # and shipped), so Hardhat compiles first.
      - name: Compile the shipped bytecode
        run: pnpm -F @safebuddy/contracts compile

      - name: forge lint (warnings are errors)
        run: pnpm -F @safebuddy/contracts forge:lint

      - name: Fuzz and invariant suites
        run: pnpm -F @safebuddy/contracts forge:test

      - name: Gas snapshot unchanged
        run: pnpm -F @safebuddy/contracts forge:snapshot:check

      - name: Build the TypeScript packages the differential suite and soak use
        run: pnpm -F @safebuddy/core -F @safebuddy/verify -F @safebuddy/watcher build

      - name: TypeScript core agrees with the contracts (differential, ffi)
        run: pnpm -F @safebuddy/contracts forge:diff

      # anvil run as Orchard behind a quai_* proxy; the whole lifecycle through the app's pipeline.
      - name: End-to-end soak on a local chain
        run: |
          node packages/contracts/scripts/local-quai-chain.mjs > "$RUNNER_TEMP/local-chain.log" 2>&1 &
          for i in $(seq 1 90); do [ -f packages/contracts/.localchain.json ] && break; sleep 1; done
          test -f packages/contracts/.localchain.json || { cat "$RUNNER_TEMP/local-chain.log"; exit 1; }
          pnpm -F @safebuddy/contracts soak:local
