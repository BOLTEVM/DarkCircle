name: Deep fuzz

# Long Foundry campaigns (20k fuzz runs per test, 1000 x 400 invariant calls) on a schedule,
# so pull requests stay fast while the vault still gets a deep search every week.
on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -F @darksafe/contracts compile
      - name: Deep campaign (random seed each week)
        run: pnpm -F @darksafe/contracts forge:deep --fuzz-seed "$(date +%s)"
